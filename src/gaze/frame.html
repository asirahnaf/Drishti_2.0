<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Drishti gaze frame</title>
  <style>
    /* This whole document is an invisible, click-through overlay. WebGazer runs
       here at the extension origin; nothing is meant to be seen. The parent page
       sizes the iframe to the full viewport so WebGazer's coordinate clamping
       (max of clientWidth/innerWidth) matches the visible viewport exactly. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    /* WebGazer injects #webgazerVideoContainer. Keep it rendering (for gesture recognition)
       while completely invisible (opacity 0) unless preview is requested. */
    #webgazerVideoContainer {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 320px !important;
      height: 240px !important;
      opacity: 0 !important;
      pointer-events: none !important;
      z-index: -100 !important;
    }
    html.show #webgazerVideoContainer {
      opacity: 1 !important;
      pointer-events: auto !important;
      z-index: 2147483647 !important;
    }
  </style>
</head>
<body>
  <!-- Load order: preload shims, webgazer, vision wasm loader & bundle, then frame.js -->
  <script src="preload.js"></script>
  <script src="../vendor/webgazer.js"></script>
  <script src="../vendor/mediapipe/gesture_recognizer/wasm/vision_wasm_internal.js"></script>
  <script src="../vendor/mediapipe/gesture_recognizer/vision_bundle.js"></script>
  <script src="frame.js"></script>
</body>
</html>
